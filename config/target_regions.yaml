# 스크리닝 대상 지역 (v7, 2026-10-12)
#
# v6까지: 서울 25구 + 경기 9시 시군구 화이트리스트 (652동).
# v7부터: 시도 단위 컨텍스트 − 제외 시군구 − 사전 거리 필터 → 통근 60분 필터.
#
#   1. context_sido   : 의원 공간조인·반경 경쟁 카운트 범위 (경계 밖 의원 누락 방지).
#   2. exclude_sgg    : 사용자 판단으로 후보에서 제외할 시군구 (startswith 매칭).
#   3. prefilter_km   : 이촌 원점 직선거리 사전 필터 — 통근 API 호출 상한용.
#                       55km 밖은 출근시간 자차·대중교통 모두 60분 초과로 간주.
#   4. 통근 60분 필터 : config/constants.py COMMUTE_LIMIT_MIN, scoring/commute.py.

context_sido:
  - 서울특별시
  - 경기도
  - 인천광역시

# 2026-10-12 사용자 결정: 경기 경부축·동남권 전체 제외 ("현실적이지 않음").
# 성남·고양·부천·안양 등 구가 있는 시는 sggnm이 "성남시분당구" 형식 → startswith.
exclude_sgg:
  경기도:
    - 성남시
    - 하남시
    - 과천시
    - 용인시
    - 광주시
    - 수원시
    - 화성시
    - 오산시
    - 의왕시
    - 군포시
    - 안양시
    - 평택시
    - 안성시
    - 이천시
    - 여주시
    - 양평군

prefilter_km: 55
